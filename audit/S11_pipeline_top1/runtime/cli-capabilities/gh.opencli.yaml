{
  "opencli": "0.1.0",
  "info": {
    "name": "gh",
    "summary": "GitHub CLI for repository discovery and metadata inspection.",
    "website": "https://cli.github.com/manual/",
    "scope": "project"
  },
  "transport": {
    "default": "cli",
    "preferMcpWhen": [],
    "preferCliWhen": [
      "repository discovery",
      "metadata inspection",
      "read-only quarantine planning"
    ]
  },
  "commands": [
    {
      "name": "search-repos",
      "command": "gh search repos \"{query}\" --limit {limit}",
      "destructive": false,
      "outputs": "repository shortlist"
    },
    {
      "name": "repo-view",
      "command": "gh repo view {repo}",
      "destructive": false,
      "outputs": "repository summary and README"
    },
    {
      "name": "repo-clone",
      "command": "gh repo clone {repo} {targetDir}",
      "destructive": false,
      "outputs": "quarantine clone"
    }
  ]
}

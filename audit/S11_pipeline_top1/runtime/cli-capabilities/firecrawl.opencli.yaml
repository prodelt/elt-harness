{
  "opencli": "0.1.0",
  "info": {
    "name": "firecrawl",
    "summary": "CLI for scrape, crawl, map, search, and agent workflows.",
    "website": "https://docs.firecrawl.dev/sdks/cli",
    "scope": "on-demand"
  },
  "transport": {
    "default": "cli",
    "preferMcpWhen": [],
    "preferCliWhen": [
      "scrape website content",
      "crawl docs sites",
      "research workflows"
    ]
  },
  "commands": [
    {
      "name": "scrape",
      "command": "firecrawl scrape {url} --only-main-content",
      "destructive": false,
      "outputs": "markdown content"
    },
    {
      "name": "crawl",
      "command": "firecrawl crawl {url} --limit {limit} --max-depth {depth} --wait -o {output}",
      "destructive": false,
      "outputs": "crawl dataset"
    },
    {
      "name": "search-scrape",
      "command": "firecrawl search \"{query}\" --scrape --scrape-formats markdown --pretty",
      "destructive": false,
      "outputs": "search results with scraped content"
    }
  ]
}

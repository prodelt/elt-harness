{
  "opencli": "0.1.0",
  "info": {
    "name": "context7",
    "summary": "Official docs lookup route with CLI fallback.",
    "website": "https://context7.com",
    "scope": "global"
  },
  "transport": {
    "default": "mcp",
    "preferMcpWhen": [
      "official API docs",
      "library signature verification"
    ],
    "preferCliWhen": [
      "hook requires explicit ctx7 CLI proof",
      "offline proof capture"
    ]
  },
  "commands": [
    {
      "name": "docs",
      "command": "cmd /c npx ctx7 docs {libraryId} \"{query}\"",
      "destructive": false,
      "outputs": "official docs excerpts"
    },
    {
      "name": "library",
      "command": "cmd /c npx ctx7 library \"{library}\" \"{query}\"",
      "destructive": false,
      "outputs": "library candidates"
    }
  ]
}

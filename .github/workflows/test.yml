name: oracle

# Две платформы намеренно. Код писался под Windows, и весь класс отказов «жёсткий C:\,
# powershell.exe, .cmd-обёртка, CRLF» на Windows невидим по построению. Замер перед вводом
# этого файла (WSL Ubuntu, node 24): из всего сьюта на Linux падал ОДИН файл, и тот — только
# под `node --test`, а не под тем запуском, которым его гоняет оракул.
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  oracle:
    name: oracle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Тесты создают git-фикстуры и коммитят в них. Без личности и без имени ветки по
      # умолчанию `git commit` в фикстуре падает, и красным станет весь сьют, а не код.
      - name: git identity для фикстур
        shell: bash
        run: |
          git config --global user.email "oracle@ci.local"
          git config --global user.name "oracle"
          git config --global init.defaultBranch main
          git config --global commit.gpgsign false

      # Гоняется ИМЕННО названный оракул проекта, а не `node --test`: это разные запуски.
      # Оракул исполняет каждый файл как `node <file>`; под `node --test` тот же файл может
      # висеть на неотпущенном хендле — и такой случай в сьюте есть (см. реестр дефектов).
      - name: механический оракул
        run: node tools/elt-oracle-runner.js --full

      - name: диагностика плагина
        run: node bin/doctor.js

      # Дрейф инструкций — красный, а не предупреждение: три копии одного текста расходились
      # молча годами (019 T013).
      - name: дрейф инструкций
        run: node tools/gen-agents-md.js --check

name: oracle

# Две платформы намеренно. Код писался под Windows, и весь класс отказов «жёсткий C:\,
# powershell.exe, .cmd-обёртка, CRLF» на Windows невидим по построению. Замер перед вводом
# этого файла (WSL Ubuntu, node 24): из всего сьюта на Linux падал ОДИН файл, и тот — только
# под `node --test`, а не под тем запуском, которым его гоняет оракул.
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  oracle:
    name: oracle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      # 020 T011 — third-party Actions прибиты к неизменяемому SHA, а не к плавающему тегу.
      # Тег `v4` владелец репозитория может передвинуть на любой коммит в любой момент, и тогда
      # шаг, стерегущий гейт, молча начнёт исполнять другой код. SHA переставляется только
      # правкой этого файла, то есть через тот же гейт, что и всё остальное.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      # 021/T008 — benchmarks/gemini-3.7-flash-high/runner.js судит writer-руку реальным pytest,
      # не мок-грейдером; корень benchmarks/ попал під оракул у T003 і вперше оголив, що pytest
      # на раннері не стоїть. Гейт слайса не слабшає — ставимо залежність, яку тест реально кличе.
      # Ставимо саме тим інтерпретатором, який зве `pytestCommand()` (runner.js) — на Windows це
      # лаунчер `py -3`, який може резолвитись НЕ в той Python, що `python` з PATH.
      - name: pytest для gradePolyglotWriter (windows)
        if: runner.os == 'Windows'
        run: py -3 -m pip install --disable-pip-version-check --quiet pytest
      - name: pytest для gradePolyglotWriter (linux)
        if: runner.os != 'Windows'
        run: python3 -m pip install --disable-pip-version-check --quiet pytest

      # Тесты создают git-фикстуры и коммитят в них. Без личности и без имени ветки по
      # умолчанию `git commit` в фикстуре падает, и красным станет весь сьют, а не код.
      #
      # 021/T008 — `safe.directory '*'`: тестовые фикстуры создаются під os.tmpdir(), а на
      # windows-latest це `D:\a\_temp` (Dev Drive/ReFS). git там повідомляє "dubious ownership"
      # для щойно створеного СВОЇМ ЖЕ процесом репозиторію — actions/checkout додає
      # safe.directory лише для шляху чекауту, а не для всього D:\. Ефемерний CI-раннер, а не
      # чиясь машина, тому '*' тут безпечний — це не той хук, про який попереджає коментар у
      # tools/git-workflow-audit.js.
      - name: git identity для фикстур
        shell: bash
        run: |
          git config --global user.email "oracle@ci.local"
          git config --global user.name "oracle"
          git config --global init.defaultBranch main
          git config --global commit.gpgsign false
          git config --global --add safe.directory '*'

      # 020 T011 — герметичность прогона утверждается ЯВНО и ДО оракула. Раньше два файла
      # сьюта читали `os.homedir()` живой машины: у разработчика они были зелёными, здесь —
      # красными, и весь named oracle на GitHub не проходил. Проверки переехали на фикстуры
      # (`tools/host-surface.test.js`), а хост-часть осталась только тут. Утверждение обратное
      # обычному: найденный на раннере глобальный скил или установленный судья это ОТКАЗ.
      # Без этого шага «оракул зелёный на CI» неотличимо от «на раннер случайно затёк хост».
      - name: герметичность — ни глобальных скилов, ни судьи
        run: node tools/host-surface.js --expect-absent

      # Гоняется ИМЕННО названный оракул проекта, а не `node --test`: это разные запуски.
      # Оракул исполняет каждый файл как `node <file>`; под `node --test` тот же файл может
      # висеть на неотпущенном хендле — и такой случай в сьюте есть (см. реестр дефектов).
      - name: механический оракул
        run: node tools/elt-oracle-runner.js --full

      - name: диагностика плагина
        run: node bin/doctor.js

      # Дрейф инструкций — красный, а не предупреждение: три копии одного текста расходились
      # молча годами (019 T013).
      - name: дрейф инструкций
        run: node tools/gen-agents-md.js --check
